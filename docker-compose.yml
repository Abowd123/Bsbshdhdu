services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres -c shared_buffers=64MB -c max_connections=50
               -c effective_cache_size=192MB -c work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wolfhost_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 300m
    mem_reservation: 128m
    cpus: 0.6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
                    --maxmemory 100mb --maxmemory-policy allkeys-lru
                    --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - wolfhost_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 150m
    mem_reservation: 64m
    cpus: 0.3

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bots_storage:/var/wolfhost/bots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wolfhost_internal
      - wolfhost_bots_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 450m
    mem_reservation: 200m
    cpus: 1.0

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bots_storage:/var/wolfhost/bots
    depends_on:
      - backend
    networks:
      - wolfhost_internal
      - wolfhost_bots_net
    mem_limit: 350m
    mem_reservation: 150m
    cpus: 0.6

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - backend
    networks:
      - wolfhost_internal
    mem_limit: 120m
    mem_reservation: 60m
    cpus: 0.2

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    env_file: .env
    networks:
      - wolfhost_internal
    mem_limit: 300m
    mem_reservation: 128m
    cpus: 0.5

  telegram_control_bot:
    build:
      context: .
      dockerfile: telegram-control-bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WOLFHOST_API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wolfhost_internal
    mem_limit: 150m
    mem_reservation: 64m
    cpus: 0.3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wolfhost_internal
    mem_limit: 80m
    mem_reservation: 32m
    cpus: 0.3

  # يُستخدم فقط عند الطلب عبر `docker compose run --rm certbot ...`
  # (لإصدار/تجديد شهادات SSL) — لا يعمل كخدمة دائمة، لا يستهلك موارد باستمرار.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  # أداة مساعدة للنسخ الاحتياطي/الاستعادة لملفات البوتات المخزّنة في volume
  # يعمل فقط عند استدعائه من scripts/backup.sh أو scripts/restore.sh
  backup_util:
    image: alpine:3.20
    profiles: ["tools"]
    volumes:
      - bots_storage:/data
      - ./backups:/backup

networks:
  wolfhost_internal:
    driver: bridge
  wolfhost_bots_net:
    name: wolfhost_bots_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  bots_storage:
  certbot_conf:
  certbot_www:
